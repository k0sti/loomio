name: Publish Docker image

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/k0sti/loomio

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    env:
      HAVESECRET: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Check Node.js toolchain configuration
        run: test/scripts/node_toolchain_test

      - name: Read Node.js toolchain versions
        id: node-toolchain
        run: |
          echo "node-version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
          echo "npm-version=$(cat .npm-version)" >> "$GITHUB_OUTPUT"

      - name: Test client asset persistence
        run: test/scripts/sync_client_assets_test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ env.HAVESECRET == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        if: ${{ env.HAVESECRET == 'true' }}
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            NODE_VERSION=${{ steps.node-toolchain.outputs.node-version }}
            NPM_VERSION=${{ steps.node-toolchain.outputs.npm-version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        if: ${{ env.HAVESECRET == 'true' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ env.HAVESECRET == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    env:
      HAVESECRET: 'true'
    steps:
      - name: Download digests
        if: ${{ env.HAVESECRET == 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
        if: ${{ env.HAVESECRET == 'true' }}

      - uses: docker/login-action@v3
        if: ${{ env.HAVESECRET == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: ${{ env.HAVESECRET == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        if: ${{ env.HAVESECRET == 'true' }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        if: ${{ env.HAVESECRET == 'true' }}
        run: |
          docker buildx imagetools inspect \
            $(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
